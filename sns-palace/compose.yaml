# SnS Palace on a computer you leave on at home, reachable from anywhere for
# free through Tailscale. Step by step: "Use it from anywhere" in README.md.
#
#   cp docker/home.env.example .env     # then fill in .env
#   docker compose up -d --build
#
# Both containers restart on their own, including after the computer reboots
# (with Docker Desktop set to start when you sign in).

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FAMILY_PIN: ${FAMILY_PIN:?Set FAMILY_PIN in .env}
      PARENT_PIN: ${PARENT_PIN:?Set PARENT_PIN in .env}
      # Optional: when empty, one is generated and kept with the videos.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Lets "Add a device" show the https://sns-palace.<tailnet>.ts.net address.
      TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      # Any other setting from .env.local.example can be added here, except
      # LOCAL_DATA_DIR and WHISPER_PYTHON, which the image sets.
    volumes:
      - data:/data
      - tailscale-socket:/var/run/tailscale
    # Shares the Tailscale container's network, so Tailscale can pass it
    # requests (and port 3000 below reaches it).
    network_mode: service:tailscale
    depends_on:
      - tailscale

  # Joins your Tailscale network as a device called "sns-palace" and serves
  # the app at https://sns-palace.<your-tailnet>.ts.net. Only this container
  # joins, not the whole computer.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: sns-palace
    restart: unless-stopped
    environment:
      # Used once, to sign in. Without one, the sign-in link is in
      # `docker compose logs tailscale`.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      # Shared with the app, which asks Tailscale for this device's address.
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./docker/tailscale-serve.json:/config/serve.json:ro
    ports:
      # Devices on the home Wi-Fi without Tailscale can still use
      # http://<this computer's address>:3000.
      - "3000:3000"

volumes:
  data:
    name: sns-palace-data
  tailscale:
    name: sns-palace-tailscale
  tailscale-socket:
    name: sns-palace-tailscale-socket
