; TeleBot firmware: PlatformIO project for the AI-Thinker ESP32-CAM.
;
;   pio run                     build (regenerates include/web_index.h first)
;   pio run -t upload           flash over USB (ESP32-CAM-MB or a 3.3 V USB-serial adapter)
;   pio run -e ota -t upload    flash over Wi-Fi (OTA_PASSWORD in include/secrets.h,
;                               and the same value in $TELEBOT_OTA_PASSWORD)
;   pio device monitor          serial log
;   pio test -e native          drive-logic unit tests, run on this computer
;
; ../Makefile wraps all of these.

[platformio]
default_envs = esp32cam

[esp32_base]
platform = espressif32 @ 8.0.0           ; Arduino-ESP32 3.3.x
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv  ; two 1.9 MB app slots, so OTA fits
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ESP32Async/AsyncTCP @ ^3.5.0
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
extra_scripts = pre:scripts/embed_web.py

[env:esp32cam]
extends = esp32_base

[env:ota]
extends = esp32_base
upload_protocol = espota
upload_port = telebot.local
upload_flags =
    --auth=${sysenv.TELEBOT_OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
