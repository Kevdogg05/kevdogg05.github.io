# NVIDIA GPU override: CUDA builds of PyTorch, and the GPU passed through.
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  backend:
    build:
      args:
        OAS_TORCH: cuda
    environment:
      OAS_COQUI_DEVICE: cuda
      OAS_SADTALKER_BATCH_SIZE: ${OAS_SADTALKER_BATCH_SIZE:-8}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
