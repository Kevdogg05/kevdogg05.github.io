<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Pals</title>
<meta name="description" content="Doodle Pals: learn to draw 54 cartoon characters step by step with an animated pencil guide and a practice sketchpad.">
<meta name="theme-color" content="#fff6ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.541.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  }
</style>
<style>
  :root { --ink: #2b2340; --bg: #fff6ea; --paper: #fffdf9; --sq: min(calc(100vw - 40px), 520px); }
  [hidden] { display: none !important; }
  @layer base {
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 10% 14%, #ffe2f1 0 110px, transparent 111px),
      radial-gradient(circle at 90% 8%, #e3f2ff 0 140px, transparent 141px),
      radial-gradient(circle at 94% 80%, #fff0c4 0 120px, transparent 121px),
      radial-gradient(circle at 4% 88%, #e4f8e9 0 110px, transparent 111px),
      radial-gradient(#f1d9bf 1.4px, transparent 1.6px) 0 0 / 26px 26px;
  }
  button:disabled { cursor: default; opacity: .4; }
  button:focus-visible, a:focus-visible { outline: 4px solid #7c6cff; outline-offset: 3px; }
  .lucide { width: 1.2em; height: 1.2em; flex: none; }

  /* chunky "3D" buttons */
  .btn3d { box-shadow: 0 5px 0 var(--sh, #eadccb); transition: transform .08s ease, box-shadow .08s ease; }
  .btn3d:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh, #eadccb); }
  .icon-btn { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; background: #fff; font-size: 24px; }

  /* logo */
  .logo-word span { display: inline-block; animation: letterBob 2.6s ease-in-out infinite; }
  @keyframes letterBob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }
  .logo-pencil { animation: logoWiggle 1.6s ease-in-out infinite; transform-origin: 30% 80%; }
  @keyframes logoWiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-3px); } }
  .logo-squiggle { stroke-dasharray: 120; animation: squiggle 2.4s ease-in-out infinite; }
  @keyframes squiggle { 0% { stroke-dashoffset: 120; } 55%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }

  /* progress + chips */
  .prog-track { height: 18px; border-radius: 999px; background: #f2e8db; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
  .prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffd23f, #ff9f43, #ff6fb5); transition: width .8s cubic-bezier(.3,1.4,.5,1); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: #fff; font-weight: 600; font-size: 17px; white-space: nowrap; --sh: #eadccb; }
  .chip[aria-pressed="true"] { background: var(--c); color: #fff; --sh: var(--csh); }
  .chip-row { scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }

  /* character cards */
  .pal-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .pal-grid.big { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  @media (max-width: 440px) { .pal-grid, .pal-grid.big { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  .pal-card {
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 10px 10px 12px; border-radius: 26px; background: #fff; border: 3px solid #fff;
    box-shadow: 0 6px 0 var(--cat-sh), 0 14px 24px -12px rgba(43,35,64,.35);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .1s;
  }
  .pal-card:hover { transform: translateY(-4px) rotate(-1.2deg); }
  .pal-card:active { transform: translateY(4px) scale(.97); box-shadow: 0 2px 0 var(--cat-sh); }
  .pal-card.done { border-color: #ffd23f; }
  .pal-art { width: 100%; aspect-ratio: 1; border-radius: 20px; background: var(--tint); display: grid; place-items: center; overflow: hidden; }
  .pal-art svg { width: 88%; height: 88%; overflow: visible; }
  .pal-name { margin-top: 8px; font-size: 21px; font-weight: 700; line-height: 1.1; }
  .pal-what { font-size: 14px; font-weight: 500; color: #7a6e93; }
  .pal-star { position: absolute; top: -12px; right: -10px; width: 42px; height: 42px; border-radius: 50%; background: #ffd23f; color: #fff; display: grid; place-items: center; box-shadow: 0 3px 0 #dda600; animation: starPop .6s cubic-bezier(.3,1.8,.5,1) both; }
  .pal-star .lucide { fill: #fff; width: 24px; height: 24px; }
  .ribbon { position: absolute; top: 14px; left: -7px; z-index: 2; display: flex; gap: 4px; align-items: center; background: var(--cat); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 12px 3px 9px; border-radius: 0 999px 999px 0; box-shadow: 0 3px 0 var(--cat-sh); }
  @keyframes starPop { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  .pal-card:not(.inview) .art * { animation-play-state: paused !important; }

  /* ---------- character idle loops (every icon is alive) ---------- */
  .idle { transform-origin: 100px 185px; animation: 2.8s ease-in-out infinite; }
  .idle-bounce { animation-name: iBounce; animation-duration: 1.7s; }
  @keyframes iBounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 35% { transform: translateY(-8px) scale(.97, 1.03); } 60% { transform: translateY(0) scale(1.04, .96); } 75% { transform: translateY(0) scale(1, 1); } }
  .idle-float { animation-name: iFloat; animation-duration: 3.2s; }
  @keyframes iFloat { 0%, 100% { transform: translateY(3px) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  .idle-sway { animation-name: iSway; animation-duration: 3s; }
  @keyframes iSway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .idle-jelly { animation-name: iJelly; animation-duration: 1.9s; }
  @keyframes iJelly { 0%, 100% { transform: scale(1, 1); } 20% { transform: scale(1.07, .93); } 40% { transform: scale(.95, 1.05); } 60% { transform: scale(1.03, .97); } 80% { transform: scale(.99, 1.01); } }
  .idle-wobble { transform-origin: 100px 110px; animation-name: iWobble; animation-duration: 2.4s; }
  @keyframes iWobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  .idle-hop { animation-name: iHop; animation-duration: 1.5s; }
  @keyframes iHop { 0%, 55%, 100% { transform: translateY(0) scale(1, 1); } 10% { transform: translateY(0) scale(1.07, .93); } 28% { transform: translateY(-16px) scale(.95, 1.06); } 45% { transform: translateY(0) scale(1.06, .94); } }
  .idle-swim { animation-name: iSwim; animation-duration: 3s; }
  @keyframes iSwim { 0%, 100% { transform: translate(-5px, 0) rotate(-3deg); } 50% { transform: translate(5px, -6px) rotate(3deg); } }
  .idle-spin { transform-origin: 105px 100px; animation-name: iSpin; animation-duration: 2.6s; }
  @keyframes iSpin { 0%, 100% { transform: rotate(-10deg) scale(1); } 50% { transform: rotate(10deg) scale(1.05); } }
  .idle-tilt { transform-origin: 100px 130px; animation-name: iTilt; animation-duration: 3.4s; }
  @keyframes iTilt { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .idle-rock { transform-origin: 100px 100px; animation-name: iRock; animation-duration: 3.6s; }
  @keyframes iRock { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(6deg); } }
  .idle-hover { animation-name: iHover; animation-duration: 1.3s; }
  @keyframes iHover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .idle-scuttle { animation-name: iScuttle; animation-duration: 1.3s; }
  @keyframes iScuttle { 0%, 100% { transform: translateX(-7px); } 25% { transform: translate(0, -3px); } 50% { transform: translateX(7px); } 75% { transform: translate(0, -3px); } }
  .idle-pulse { transform-origin: 96px 104px; animation-name: iPulse; animation-duration: 1.7s; }
  @keyframes iPulse { 0%, 100% { transform: scale(.93); } 50% { transform: scale(1.06); } }
  .idle-waddle { animation-name: iWaddle; animation-duration: 1.1s; }
  @keyframes iWaddle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
  .idle-inch { transform-origin: 40px 160px; animation-name: iInch; animation-duration: 2.2s; }
  @keyframes iInch { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.07) translateY(-2px); } }
  .idle-bob { animation-name: iBob; animation-duration: 2.4s; }
  @keyframes iBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .idle-jfloat { animation-name: iJFloat; animation-duration: 2.4s; }
  @keyframes iJFloat { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-9px) scale(.95, 1.05); } 60% { transform: translateY(-4px) scale(1.04, .96); } }
  .idle-none { animation: none; }

  /* ---------- body-part loops ---------- */
  .pa { animation: 1.6s ease-in-out infinite; }
  .pa-bob { animation-name: pBob; }
  @keyframes pBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pa-wag { animation-name: pWag; animation-duration: .9s; }
  @keyframes pWag { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  .pa-flapL { animation-name: pFlapL; animation-duration: .55s; }
  @keyframes pFlapL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-15deg); } }
  .pa-flapR { animation-name: pFlapR; animation-duration: .55s; }
  @keyframes pFlapR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(15deg); } }
  .pa-bfly { animation-name: pBfly; animation-duration: .7s; }
  @keyframes pBfly { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.55); } }
  .pa-twinkle { transform-box: fill-box; transform-origin: center; animation-name: pTw; }
  @keyframes pTw { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(.55) rotate(25deg); opacity: .55; } }
  .pa-flicker { animation-name: pFl; animation-duration: .45s; }
  @keyframes pFl { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.9, 1.16); } }
  .pa-floatup { transform-box: fill-box; transform-origin: center; animation-name: pUp; animation-duration: 2.6s; animation-timing-function: ease-out; }
  @keyframes pUp { 0% { transform: translateY(8px) scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-18px) scale(1); opacity: 0; } }
  .pa-spin { animation: pSpin 16s linear infinite; }
  @keyframes pSpin { to { transform: rotate(360deg); } }
  .pa-wave { animation-name: pWave; animation-duration: 1s; }
  @keyframes pWave { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  .pa-tent { animation-name: pTent; animation-duration: 1.4s; }
  @keyframes pTent { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .pa-drip { transform-box: fill-box; transform-origin: 50% 0; animation-name: pDrip; animation-duration: 2.2s; animation-timing-function: ease-in; }
  @keyframes pDrip { 0% { transform: translateY(-6px) scale(.3); opacity: 0; } 30% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(12px) scale(1); opacity: 0; } }
  .pa-snapL { animation-name: pSnapL; animation-duration: 1.1s; }
  @keyframes pSnapL { 0%, 55%, 100% { transform: rotate(0); } 70% { transform: rotate(-16deg); } }
  .pa-snapR { animation-name: pSnapR; animation-duration: 1.1s; }
  @keyframes pSnapR { 0%, 55%, 100% { transform: rotate(0); } 70% { transform: rotate(16deg); } }
  .pa-steam { transform-box: fill-box; transform-origin: center; animation-name: pSteam; animation-duration: 2.4s; }
  @keyframes pSteam { 0% { transform: translateY(5px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-9px); opacity: 0; } }
  .pa-beam { animation-name: pBeam; animation-duration: 1.8s; }
  @keyframes pBeam { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
  .pa-zzz { transform-box: fill-box; transform-origin: center; animation-name: pZ; animation-duration: 2.4s; }
  @keyframes pZ { 0% { transform: translate(-5px, 7px) scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(5px, -9px) scale(1.1); opacity: 0; } }
  .pa-swayx { animation-name: pSx; animation-duration: 2.4s; }
  @keyframes pSx { 0%, 100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  .pa-flop { animation-name: pFlop; animation-duration: 1.4s; }
  @keyframes pFlop { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
  .pa-flopR { animation-name: pFlopR; animation-duration: 1.4s; }
  @keyframes pFlopR { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-7deg); } }
  .pa-earL { animation-name: pEarL; animation-duration: 2.2s; }
  @keyframes pEarL { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-9deg); } 90% { transform: rotate(3deg); } }
  .pa-earR { animation-name: pEarR; animation-duration: 2.2s; }
  @keyframes pEarR { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(9deg); } 90% { transform: rotate(-3deg); } }
  .pa-spout { transform-box: fill-box; transform-origin: 50% 100%; animation-name: pSpout; animation-duration: 1.4s; }
  @keyframes pSpout { 0%, 100% { transform: scale(.8); } 50% { transform: scale(1.12); } }
  .blink { animation: blink 4.2s infinite; animation-delay: var(--bd, 0s); }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .art.still * { animation: none !important; }

  /* ---------- guide screen ---------- */
  #guide { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .tip-card { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 24px; padding: 10px 12px 10px 10px; border: 3px solid var(--cat); box-shadow: 0 5px 0 var(--cat-sh); }
  .tip-pop { animation: tipPop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes tipPop { 0% { transform: scale(.9) rotate(-1deg); opacity: .4; } 100% { transform: none; opacity: 1; } }
  .step-badge { flex: none; width: 56px; height: 56px; border-radius: 18px; background: var(--cat); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; box-shadow: 0 4px 0 var(--cat-sh); }
  .panels { display: grid; grid-template-columns: var(--sq); justify-content: center; gap: 14px 20px; }
  @media (min-width: 760px) {
    :root { --sq: max(250px, min(calc((100vw - 84px) / 2), calc(100dvh - 366px), 620px)); }
    .panels { grid-template-columns: var(--sq) var(--sq); }
  }
  .panel { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .panel-bar { display: flex; align-items: center; gap: 8px; min-height: 48px; flex-wrap: wrap; }
  .panel-title { font-size: 20px; font-weight: 700; margin-right: auto; display: flex; align-items: center; gap: 6px; }
  .paper {
    position: relative; width: var(--sq); height: var(--sq); border-radius: 26px; overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(#d6def0 1.4px, transparent 1.6px);
    background-size: calc(var(--sq) / 10) calc(var(--sq) / 10);
    background-position: calc(var(--sq) / 20 - 5px) calc(var(--sq) / 20 - 5px);
    box-shadow: inset 0 0 0 3px #efe2d0, 0 6px 0 #eadccb;
  }
  .paper > svg, .paper > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage { overflow: visible; }
  #pad { touch-action: none; cursor: crosshair; }
  #stage .g-past path { fill: none; stroke: #8ec5ff; stroke-width: 3.4; }
  #stage .g-past path.ink { fill: #8ec5ff; }
  #stage .g-ghost path { fill: none; stroke: #2b2340; stroke-opacity: .16; stroke-width: 3; stroke-dasharray: .1 7; }
  #stage .g-cur path { fill: none; stroke: #1c1830; stroke-width: 4.6; }
  #stage .g-cur path.ink { fill: #1c1830; fill-opacity: 0; transition: fill-opacity .15s; }
  #stage .g-cur.flash path { animation: flashP .5s ease-in-out 3; }
  #stage .g-cur.flash path.ink { animation-name: flashI; }
  @keyframes flashP { 50% { stroke: #ff3d9a; stroke-width: 6.4; } }
  @keyframes flashI { 50% { stroke: #ff3d9a; stroke-width: 6.4; fill: #ff3d9a; } }
  .aim-ring { fill: none; stroke: #ff3d9a; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: aim .7s ease-out infinite; }
  @keyframes aim { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  #trace path { fill: none; stroke: #cfd8ea; stroke-width: 3.4; }
  .legend { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.9); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: #6b5f86; pointer-events: none; }
  .legend i { display: inline-block; width: 18px; height: 5px; border-radius: 4px; margin-right: 5px; vertical-align: middle; }
  .pad-hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-weight: 600; font-size: 16px; color: #a99fbd; pointer-events: none; }
  .peek { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,253,249,.97); animation: fadeIn .25s ease; cursor: pointer; --hole: #fffdf9; }
  .peek svg { width: 80%; height: 80%; overflow: visible; }
  .peek-tag { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--cat); color: #fff; font-weight: 700; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
  @keyframes fadeIn { from { opacity: 0; } }
  .tool { width: 42px; height: 42px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 20px; --sh: #eadccb; }
  .tool[aria-pressed="true"] { background: var(--cat); color: #fff; --sh: var(--cat-sh); }
  .swatch { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 2px #e3d7c6; transition: transform .15s; flex: none; }
  .swatch[aria-pressed="true"] { transform: scale(1.18); box-shadow: 0 0 0 3px var(--ink); }
  .size-dot { display: block; border-radius: 50%; background: currentColor; }
  .speed { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #fff; --sh: #eadccb; font-weight: 700; font-size: 15px; }
  .sp-track { position: relative; width: 46px; height: 26px; border-radius: 999px; background: #c9efd6; transition: background .2s; }
  .sp-knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  .speed[aria-checked="true"] .sp-track { background: #ffc2de; }
  .speed[aria-checked="true"] .sp-knob { transform: translateX(20px); }
  .speed .sp-slow { color: #18a35a; }
  .speed .sp-fast { color: #b9b0c9; }
  .speed[aria-checked="true"] .sp-slow { color: #b9b0c9; }
  .speed[aria-checked="true"] .sp-fast { color: #f0509b; }
  .guide-nav { position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(255,246,234,0), var(--bg) 35%); }
  .nav-btn { min-width: 128px; height: 62px; border-radius: 22px; padding: 0 22px; font-size: 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .nav-next { background: var(--cat); color: #fff; --sh: var(--cat-sh); }
  .nav-next.finish { background: #ffc61a; color: #5a3b00; --sh: #d99a00; animation: finishGlow 1.2s ease-in-out infinite; }
  .nav-next.finish .lucide { fill: currentColor; }
  @keyframes finishGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #e7dccd; transition: transform .2s, background .2s; }
  .dot.past { background: #8ec5ff; }
  .dot.now { background: var(--cat); transform: scale(1.35); }
  @media (max-width: 480px) {
    .nav-btn { min-width: 0; height: 56px; padding: 0 16px; font-size: 19px; border-radius: 20px; }
    .dot { width: 12px; height: 12px; }
    #dots { gap: 6px; }
    .panel-title { font-size: 18px; }
    #speedLabel { display: none; }
    .tip-card { gap: 10px; }
    .c-art, .c-mine img { width: 132px; height: 132px; }
  }

  /* celebration + toast */
  .celebrate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(43,35,64,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fadeIn .3s ease; }

  .big-star { width: 76px; height: 76px; margin: 0 auto 8px; border-radius: 50%; background: #ffd23f; color: #fff; display: grid; place-items: center; box-shadow: 0 5px 0 #dda600; animation: starPop .8s cubic-bezier(.3,1.8,.5,1) .2s both; }

  .confetto { position: absolute; top: -24px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

<script>
(() => {
'use strict';

/* =====================================================================
   1. GEOMETRY HELPERS — every character lives in a 200 x 200 box
   ===================================================================== */
const INK = '#2b2340';
const r1 = v => Math.round(v * 10) / 10;
const P = (s, ...v) => s.reduce((a, x, i) => a + x + (i < v.length ? (typeof v[i] === 'number' ? r1(v[i]) : v[i]) : ''), '');
const C = (x, y, r) => P`M${x} ${y - r}A${r} ${r} 0 1 0 ${x} ${y + r}A${r} ${r} 0 1 0 ${x} ${y - r}`;
const E = (x, y, rx, ry) => P`M${x} ${y - ry}A${rx} ${ry} 0 1 0 ${x} ${y + ry}A${rx} ${ry} 0 1 0 ${x} ${y - ry}`;
const ER = (x, y, rx, ry, a) => { const t = a * Math.PI / 180, sx = Math.sin(t) * ry, sy = Math.cos(t) * ry; return P`M${x + sx} ${y - sy}A${rx} ${ry} ${a} 1 0 ${x - sx} ${y + sy}A${rx} ${ry} ${a} 1 0 ${x + sx} ${y - sy}`; };
const RR = (x, y, w, h, r) => P`M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
const pol = (cx, cy, r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
/* S(path, fill, options): one pencil stroke.
   options: z (layer), fd (fill-only path), ink (filled while drawing), deco (icon only), ns (no outline),
            sc (stroke colour), w (stroke width), tw (thick tube line), fo (fill opacity), op (opacity),
            a (part animation), o (animation origin), dl (animation delay), blink (eye centre) */
const S = (d, f, o) => Object.assign({ d, f }, o);
const lay = (arr, z, x = {}) => arr.map(s => ({ ...s, z, ...x }));

function smooth(pts, closed) {
  const n = pts.length; let d = P`M${pts[0][0]} ${pts[0][1]}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = closed ? pts[(i - 1 + n) % n] : pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[(i + 1) % n];
    const p3 = closed ? pts[(i + 2) % n] : pts[Math.min(n - 1, i + 2)];
    d += P`C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  return closed ? d + 'Z' : d;
}
const wavy = (cx, cy, R, n, amp) => smooth(Array.from({ length: 72 }, (_, i) => { const t = i / 72 * Math.PI * 2 - Math.PI / 2, r = R + amp * Math.cos(n * t); return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; }), true);
const spiral = (cx, cy, r0, r1, turns) => { const N = Math.round(turns * 20); return smooth(Array.from({ length: N + 1 }, (_, i) => { const t = i / N, a = -Math.PI / 2 + t * turns * Math.PI * 2, r = r0 + (r1 - r0) * t; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }), false); };
function scallop(cx, cy, rx, ry, n, bulge = 1) {
  const pts = Array.from({ length: n + 1 }, (_, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  let d = P`M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i <= n; i++) { const r = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) / 2 * bulge; d += P`A${r} ${r} 0 0 1 ${pts[i][0]} ${pts[i][1]}`; }
  return d + 'Z';
}
function star(cx, cy, R, r, t = .22) {
  const p = Array.from({ length: 10 }, (_, i) => pol(cx, cy, i % 2 ? r : R, -90 + i * 36));
  let d = '';
  for (let i = 0; i < 10; i += 2) {
    const o = p[i], a = p[(i + 9) % 10], b = p[i + 1];
    d += P`${i ? 'L' : 'M'}${o[0] + (a[0] - o[0]) * t} ${o[1] + (a[1] - o[1]) * t}Q${o[0]} ${o[1]} ${o[0] + (b[0] - o[0]) * t} ${o[1] + (b[1] - o[1]) * t}L${b[0]} ${b[1]}`;
  }
  return d + 'Z';
}
const sparkle = (x, y, s) => P`M${x} ${y - s}Q${x + s * .15} ${y - s * .15} ${x + s} ${y}Q${x + s * .15} ${y + s * .15} ${x} ${y + s}Q${x - s * .15} ${y + s * .15} ${x - s} ${y}Q${x - s * .15} ${y - s * .15} ${x} ${y - s}Z`;
const heart = (x, y, s) => P`M${x} ${y + s * .9}C${x - s * 1.6} ${y - s * .1} ${x - s * .7} ${y - s * 1.15} ${x} ${y - s * .35}C${x + s * .7} ${y - s * 1.15} ${x + s * 1.6} ${y - s * .1} ${x} ${y + s * .9}Z`;
const drop = (x, y, s) => P`M${x} ${y - 1.4 * s}C${x + .3 * s} ${y - .6 * s} ${x + s} ${y - .2 * s} ${x + s} ${y + .4 * s}A${s} ${s} 0 0 1 ${x - s} ${y + .4 * s}C${x - s} ${y - .2 * s} ${x - .3 * s} ${y - .6 * s} ${x} ${y - 1.4 * s}Z`;
const zz = (x, y, s) => P`M${x} ${y}h${s}l${-s} ${s}h${s}`;
function leaf(x, y, len, ang, w) {
  const a = ang * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx, tx = x + dx * len, ty = y + dy * len;
  return P`M${x} ${y}C${x + dx * len * .3 + nx * w} ${y + dy * len * .3 + ny * w} ${x + dx * len * .8 + nx * w * .8} ${y + dy * len * .8 + ny * w * .8} ${tx} ${ty}C${x + dx * len * .8 - nx * w * .8} ${y + dy * len * .8 - ny * w * .8} ${x + dx * len * .3 - nx * w} ${y + dy * len * .3 - ny * w} ${x} ${y}Z`;
}
const spike = (cx, cy, r, len, a, h, closed) => { const [x1, y1] = pol(cx, cy, r, a - h), [x2, y2] = pol(cx, cy, r + len, a), [x3, y3] = pol(cx, cy, r, a + h); return P`M${x1} ${y1}L${x2} ${y2}L${x3} ${y3}` + (closed ? 'Z' : ''); };
const petals = (cx, cy, r, n, R) => Array.from({ length: n }, (_, i) => { const a = -90 + i * 360 / n, [x1, y1] = pol(cx, cy, r, a - 17), [ax, ay] = pol(cx, cy, R, a - 26), [bx, by] = pol(cx, cy, R, a + 26), [x2, y2] = pol(cx, cy, r, a + 17); return P`M${x1} ${y1}C${ax} ${ay} ${bx} ${by} ${x2} ${y2}`; });

/* Reusable body parts */
const K = { cheek: '#ff9ec4', rose: '#ff6f91', yellow: '#ffe066', gold: '#ffc94d', red: '#ff6b6b', orange: '#ffb066', purple: '#c4a8ff', pink: '#ffb8d9', blue: '#9fd3ff', sky: '#d4efff', dark: '#3d3552' };
function eye(x, y, r) {
  const a = [S(E(x, y, r * .86, r), INK, { ink: 1, blink: [x, y], w: 2 }), S(C(x - r * .3, y - r * .38, r * .34), '#fff', { deco: 1, ns: 1, blink: [x, y] })];
  if (r >= 6) a.push(S(C(x + r * .32, y + r * .38, r * .16), '#fff', { deco: 1, ns: 1, blink: [x, y] }));
  return a;
}
const cheeks = (x, y, dx, k = 1) => [S(E(x - dx, y, 5 * k, 3.2 * k), K.cheek, { ns: 1, op: .9, w: 3 }), S(E(x + dx, y, 5 * k, 3.2 * k), K.cheek, { ns: 1, op: .9, w: 3 })];
function face(x, y, o = {}) {
  const k = o.k ?? 1, g = o.g ?? 14, out = [], ey = o.eyes ?? 'dot', my = y + (o.my ?? 8) * k;
  if (ey === 'dot') out.push(...eye(x - g, y, 5 * k * (o.es ?? 1)), ...eye(x + g, y, 5 * k * (o.es ?? 1)));
  else if (ey === 'happy') for (const s of [-1, 1]) out.push(S(P`M${x + s * g - 4.5 * k} ${y + 2 * k}Q${x + s * g} ${y - 5 * k} ${x + s * g + 4.5 * k} ${y + 2 * k}`, null, { w: 4 }));
  else if (ey === 'sleepy') for (const s of [-1, 1]) out.push(S(P`M${x + s * g - 5 * k} ${y - k}Q${x + s * g} ${y + 5 * k} ${x + s * g + 5 * k} ${y - k}`, null, { w: 4 }));
  const m = o.m ?? 'smile', smile = S(P`M${x - 5 * k} ${my}Q${x} ${my + 6 * k} ${x + 5 * k} ${my}`, null, { w: 3.5 });
  if (m === 'smile') out.push(smile);
  else if (m === 'open') out.push(S(P`M${x - 6.5 * k} ${my - k}Q${x} ${my + 13 * k} ${x + 6.5 * k} ${my - k}Z`, K.rose, { w: 3.5 }));
  else if (m === 'cat') out.push(S(P`M${x - 7 * k} ${my - k}Q${x - 3.5 * k} ${my + 5 * k} ${x} ${my - k}Q${x + 3.5 * k} ${my + 5 * k} ${x + 7 * k} ${my - k}`, null, { w: 3.5 }));
  else if (m === 'oh') out.push(S(E(x, my + 2 * k, 3.5 * k, 4.5 * k), K.rose, { w: 3.5 }));
  else if (m === 'tongue') out.push(smile, S(P`M${x - 3 * k} ${my + 3 * k}Q${x} ${my + 11 * k} ${x + 3 * k} ${my + 3 * k}`, K.rose, { w: 3 }));

    }
  },
  up() { if (!this.active) return; this.cap(this.ctx, this.active, this.cv.width, this.cv.height); this.active = null; },
  pen(ctx, s, w) { ctx.globalCompositeOperation = s.er ? 'destination-out' : 'source-over'; ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = s.w / 200 * w; ctx.lineCap = ctx.lineJoin = 'round'; },
  seg(ctx, s, k, w, h) {
    const P = s.p, X = p => [p[0] * w, p[1] * h]; this.pen(ctx, s, w); ctx.beginPath();
    if (k === 1) { ctx.moveTo(...X(P[0])); ctx.lineTo(...X(mid(P[0], P[1]))); }
    else { ctx.moveTo(...X(mid(P[k - 2], P[k - 1]))); ctx.quadraticCurveTo(...X(P[k - 1]), ...X(mid(P[k - 1], P[k]))); }
    ctx.stroke();
  },
  cap(ctx, s, w, h) {
    const P = s.p, X = p => [p[0] * w, p[1] * h]; this.pen(ctx, s, w); ctx.beginPath();
    if (P.length === 1) { const [x, y] = X(P[0]); ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.moveTo(...X(mid(P[P.length - 2], P[P.length - 1]))); ctx.lineTo(...X(P[P.length - 1])); ctx.stroke(); }
  },
  paint(ctx, w, h) {
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, w, h);
    for (const s of this.strokes) { for (let k = 1; k < s.p.length; k++) this.seg(ctx, s, k, w, h); this.cap(ctx, s, w, h); }
  },
  redraw() { this.paint(this.ctx, this.cv.width, this.cv.height); $('#padHint').hidden = this.strokes.length > 0; },
  undo() { this.strokes.pop(); this.redraw(); Sfx.play('back'); },
  clear() { if (!this.strokes.length) return; this.strokes.length = 0; this.redraw(); Sfx.play('clear'); },
  snapshot(size = 600) {
    if (!this.strokes.some(s => !s.er)) return null;
    const ink = document.createElement('canvas'); ink.width = ink.height = size; this.paint(ink.getContext('2d'), size, size);
    const out = document.createElement('canvas'); out.width = out.height = size;
    const o = out.getContext('2d'); o.fillStyle = '#fffdf9'; o.fillRect(0, 0, size, size); o.drawImage(ink, 0, 0);
    return out.toDataURL('image/png');
  },
};
function paintTools() {
  $('#swatches').innerHTML = COLORS.map(([n, c]) => `<button class="swatch" data-color="${c}" style="--c:${c}" aria-label="${n} pencil" aria-pressed="${!Pad.eraser && Pad.color === c}"></button>`).join('')
    + `<button id="sizeBtn" class="tool btn3d ml-auto" aria-label="Pencil size: ${['thin', 'medium', 'thick'][Pad.size]}" title="Pencil size"><span class="size-dot" style="width:${[6, 11, 18][Pad.size]}px;height:${[6, 11, 18][Pad.size]}px;color:${Pad.color}"></span></button>`;
  $('#eraserBtn').setAttribute('aria-pressed', Pad.eraser);
  $('#traceBtn').setAttribute('aria-pressed', prefs.trace);
}

/* =====================================================================
   8. GUIDE SCREEN
   ===================================================================== */
const G = { ch: null, step: 0 };
function openGuide(ch) {
  G.ch = ch; G.step = 0;
  const c = CAT[ch.cat];
  document.title = `Draw ${ch.name} · Doodle Pals`;
  $('#guide').style.cssText = catVars(c); $('#celebrate').style.cssText = catVars(c); $('#toast').style.cssText = catVars(c);
  $('#library').hidden = true; $('#guide').hidden = false; window.scrollTo(0, 0);
  $('#gIcon').innerHTML = artSVG(ch); $('#gName').textContent = `${ch.name} the ${ch.what}`; $('#gCat').textContent = `${c.emoji} ${c.name}`;
  $('#peek').hidden = true;
  Demo.setPlaying(true); paintSpeed();
  Pad.use(ch.id); paintTools();
  renderStep(false); Demo.start();
}
function renderStep(pop = true) {
  const ch = G.ch, st = ch.steps[G.step], n = ch.steps.length, last = G.step === n - 1;
  $('#stepBadge').textContent = G.step + 1;
  $('#stepOf').textContent = `Step ${G.step + 1} of ${n}`;
  $('#tipText').textContent = st.t;
  if (pop) { const tc = $('#tipCard'); tc.classList.remove('tip-pop'); void tc.offsetWidth; tc.classList.add('tip-pop'); }
  $('#backBtn').disabled = G.step === 0;
  $('#backBtn').innerHTML = `${ico('arrow-left')} Back`;
  const nb = $('#nextBtn'); nb.classList.toggle('finish', last);
  nb.innerHTML = last ? `I drew it! ${ico('star')}` : `Next ${ico('arrow-right')}`;
  $('#dots').innerHTML = ch.steps.map((_, i) => `<button class="dot ${i < G.step ? 'past' : i === G.step ? 'now' : ''}" data-step="${i}" aria-label="Go to step ${i + 1}"${i === G.step ? ' aria-current="step"' : ''}></button>`).join('');
  $('#gDone').hidden = !isDone(ch.id);
  // stage: finished steps in blue, the current step in black (animated), a faint dotted preview of where it goes
  let past = '', cur = '', ghost = '';
  for (let i = 0; i < G.step; i++) for (const s of ch.steps[i].g) past += `<path d="${s.d}"${s.ink ? ' class="ink"' : ''}/>`;
  for (const s of st.g) { cur += `<path d="${s.d}"${s.ink ? ' class="ink"' : ''}/>`; ghost += `<path d="${s.d}"/>`; }
  $('#stage').innerHTML = `<defs><filter id="psh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="2" dy="3" stdDeviation="1.6" flood-color="#2b2340" flood-opacity=".28"/></filter></defs>
    <g class="g-past">${past}</g><g class="g-ghost">${ghost}</g><g class="g-cur" id="gCur">${cur}</g>
    <g id="aim"><circle class="aim-ring" r="7"/></g>${PENCIL}`;
  Demo.setup();
  // tracing paper on the sketchpad shows everything up to this step
  $('#trace').toggleAttribute('hidden', !prefs.trace);
  $('#trace').innerHTML = ch.steps.slice(0, G.step + 1).flatMap(s => s.g).map(s => `<path d="${s.d}"/>`).join('');
}
function goStep(i, cheer) {
  if (i < 0 || i >= G.ch.steps.length || i === G.step) return;
  G.step = i; renderStep();
  if (cheer) toast(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
}
function next() {
  if (G.step === G.ch.steps.length - 1) return celebrate();
  Sfx.play('next'); goStep(G.step + 1, true);
}
function back() { if (G.step > 0) { Sfx.play('back'); goStep(G.step - 1); } }
function paintSpeed() {
  const b = $('#speedBtn'); b.setAttribute('aria-checked', prefs.fast);
  b.setAttribute('aria-label', prefs.fast ? 'Speed: fast. Tap to slow down' : 'Speed: slow. Tap to speed up');
  $('#speedLabel').textContent = prefs.fast ? 'Fast' : 'Slow';
}
function peek() {
  const el = $('#peek');
  if (!el.hidden) { el.hidden = true; return; }
  el.innerHTML = `<span class="peek-tag">Sneak peek! 👀</span>${artSVG(G.ch)}`; el.hidden = false; Sfx.play('pop');
  clearTimeout(peek.t); peek.t = setTimeout(() => { el.hidden = true; }, 3200);
}

/* =====================================================================
   9. CELEBRATION
   ===================================================================== */
function confetti() {
  const host = $('#confetti'), colors = ['#ff6fb5', '#ffd23f', '#7c6cff', '#22b866', '#1ea5e0', '#ff9334'];
  host.replaceChildren();
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i'); p.className = 'confetto';
    p.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % 6]};width:${8 + Math.random() * 7}px;height:${10 + Math.random() * 9}px;border-radius:${Math.random() > .5 ? '50%' : '3px'};animation-duration:${1.8 + Math.random() * 1.7}s;animation-delay:${Math.random() * .5}s;--dx:${Math.round((Math.random() * 2 - 1) * 140)}px;--r:${Math.round(Math.random() * 900 - 450)}deg`;
    host.appendChild(p);
  }
  clearTimeout(confetti.t); confetti.t = setTimeout(() => host.replaceChildren(), 4500);
}
function nextPal() {
  const i = CHARS.indexOf(G.ch), rest = [...CHARS.slice(i + 1), ...CHARS.slice(0, i)];
  return rest.find(c => !isDone(c.id)) || rest[0];
}
function celebrate() {
  const ch = G.ch, first = !isDone(ch.id);
  if (first) { prefs.done.push(ch.id); save(); }
  Sfx.play('win'); confetti(); Demo.stop(); $('#toast').classList.remove('show');
  $('#cTitle').textContent = `You drew ${ch.name}! 🎉`;
  $('#cSub').textContent = first ? `+1 star! That's ${doneCount()} of ${CHARS.length} pals.` : 'Even better the second time! 🌈';
  $('#cArt').innerHTML = artSVG(ch);
  const snap = Pad.snapshot();
  $('#cMine').hidden = !snap; $('#cSave').hidden = !snap;
  if (snap) { $('#cImg').src = snap; $('#cSave').href = snap; $('#cSave').download = `doodle-pals-${ch.id}.png`; }
  const np = nextPal(); $('#cNext').innerHTML = `Next: ${np.name} ${ico('arrow-right')}`; $('#cNext').dataset.id = np.id;
  $('#gDone').hidden = false;
  $('#celebrate').hidden = false; $('#cNext').focus();
}
function closeCelebrate() { $('#celebrate').hidden = true; $('#confetti').replaceChildren(); }

/* =====================================================================
   10. ROUTER + WIRING
   ===================================================================== */
function showLibrary() {
  Demo.stop(); if ('speechSynthesis' in window) speechSynthesis.cancel();
  closeCelebrate(); document.title = 'Doodle Pals';
  $('#guide').hidden = true; $('#library').hidden = false; renderLibrary();
}
function route() {
  const m = location.hash.match(/^#\/draw\/([\w-]+)/);
  if (m && byId[m[1]]) { closeCelebrate(); openGuide(byId[m[1]]); } else showLibrary();
}
const go = id => { location.hash = `#/draw/${id}`; };
const home = () => { if (location.hash.startsWith('#/draw/')) location.hash = '#/'; else showLibrary(); };

function wire() {
  document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico); });
  paintSound();
  $('#soundBtn').onclick = toggleSound; $('#soundBtn2').onclick = toggleSound;
  $('#library').addEventListener('click', e => {
    const card = e.target.closest('.pal-card'); if (card) { Sfx.play('tap'); return go(card.dataset.id); }
    const chip = e.target.closest('.chip'); if (chip) { filter = chip.dataset.f; Sfx.play('pop'); renderLibrary(); }
  });
  $('#surpriseBtn').onclick = () => { const left = CHARS.filter(c => !isDone(c.id)), pool = left.length ? left : CHARS; Sfx.play('tap'); go(pool[Math.floor(Math.random() * pool.length)].id); };
  $('#resetBtn').onclick = () => { if (confirm('Erase all your stars and start over?')) { prefs.done = []; save(); renderLibrary(); } };
  $('#homeBtn').onclick = () => { Sfx.play('back'); home(); };
  $('#nextBtn').onclick = next; $('#backBtn').onclick = back;
  $('#dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) { Sfx.play('pop'); goStep(+d.dataset.step); } });
  $('#speakBtn').onclick = () => speak(`Step ${G.step + 1}. ${G.ch.steps[G.step].t}`);
  $('#speedBtn').onclick = () => { prefs.fast = !prefs.fast; save(); paintSpeed(); Sfx.play(prefs.fast ? 'next' : 'back'); };
  $('#playBtn').onclick = () => { Demo.setPlaying(!Demo.playing); Sfx.play('pop'); };
  $('#peekBtn').onclick = peek; $('#peek').onclick = peek;
  $('#swatches').addEventListener('click', e => {
    const sw = e.target.closest('.swatch');
    if (sw) { Pad.color = sw.dataset.color; Pad.eraser = false; }
    else if (e.target.closest('#sizeBtn')) Pad.size = (Pad.size + 1) % SIZES.length;
    else return;
    Sfx.play('pop'); paintTools();
  });
  $('#eraserBtn').onclick = () => { Pad.eraser = !Pad.eraser; Sfx.play('pop'); paintTools(); };
  $('#undoBtn').onclick = () => Pad.undo();
  $('#clearBtn').onclick = () => Pad.clear();
  $('#traceBtn').onclick = () => { prefs.trace = !prefs.trace; save(); $('#trace').toggleAttribute('hidden', !prefs.trace); Sfx.play('pop'); paintTools(); };
  $('#cNext').onclick = () => { closeCelebrate(); go($('#cNext').dataset.id); };
  $('#cAgain').onclick = () => { closeCelebrate(); Pad.strokes.length = 0; Pad.redraw(); G.step = 0; renderStep(); Demo.start(); };
  $('#cHome').onclick = () => { closeCelebrate(); home(); };
  document.addEventListener('keydown', e => {
    if (!$('#celebrate').hidden) { if (e.key === 'Escape') { closeCelebrate(); Demo.start(); } return; }
    if ($('#guide').hidden || e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') back(); else if (e.key === 'Escape') home();
  });
  window.addEventListener('hashchange', route);
}

Pad.init(); wire(); route();
})();
</script>
